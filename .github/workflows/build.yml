name: Build Chiroot Desktop (macOS)

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build-macos-intel:
    name: Build macOS x86_64 (High Sierra 10.13+)
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log runner and toolchain environment
        run: |
          echo "=== macOS Runner Info ==="
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --show-sdk-path || true
          xcrun --show-sdk-version || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable toolchain (x86_64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Tauri CLI
        run: npm ci

      - name: Run Rust unit tests
        run: cargo test --target x86_64-apple-darwin --verbose

      - name: Build Chiroot Desktop (.app and .dmg) in release mode
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: |
          npx tauri build \
            --target x86_64-apple-darwin \
            --bundles app,dmg \
            --verbose

      - name: Verify macOS High Sierra 10.13 compatibility and app bundle
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/x86_64-apple-darwin/release/bundle"
          APP_PATH="${BUNDLE_DIR}/macos/Chiroot Desktop.app"
          BIN_PATH="${APP_PATH}/Contents/MacOS/chiroot-desktop"
          PLIST_PATH="${APP_PATH}/Contents/Info.plist"
          ICON_PATH="${APP_PATH}/Contents/Resources/icon.icns"

          echo "=== Checking .app bundle structure ==="
          test -d "${APP_PATH}"
          test -x "${BIN_PATH}"
          test -f "${PLIST_PATH}"
          test -s "${ICON_PATH}"

          echo "=== Checking binary architecture ==="
          lipo -info "${BIN_PATH}"
          lipo -info "${BIN_PATH}" | grep -q "x86_64"

          echo "=== Checking Mach-O minimum macOS deployment target ==="
          OTOOL_OUT="$(otool -l "${BIN_PATH}" | grep -A 4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' || true)"
          echo "${OTOOL_OUT}"
          if ! echo "${OTOOL_OUT}" | grep -qE '(minos|version) 10\.13'; then
            echo "::error::Binary deployment target is not 10.13! High Sierra compatibility check failed."
            exit 1
          fi

          echo "=== Checking Info.plist metadata ==="
          plutil -lint "${PLIST_PATH}"
          MIN_SYS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "${PLIST_PATH}")"
          echo "LSMinimumSystemVersion = ${MIN_SYS}"
          test "${MIN_SYS}" = "10.13"

          ICON_FILE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "${PLIST_PATH}")"
          echo "CFBundleIconFile = ${ICON_FILE}"
          test -n "${ICON_FILE}"

          MIC_DESC="$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "${PLIST_PATH}")"
          echo "NSMicrophoneUsageDescription = ${MIC_DESC}"
          test -n "${MIC_DESC}"

          echo "=== Checking Binary Size ==="
          ls -lh "${BIN_PATH}"
          du -sh "${APP_PATH}"

      - name: Build macOS .pkg installer and archive .app
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/x86_64-apple-darwin/release/bundle"
          APP_PATH="${BUNDLE_DIR}/macos/Chiroot Desktop.app"
          DIST_DIR="dist-artifacts"
          mkdir -p "${DIST_DIR}"

          # Copy DMG generated by Tauri
          cp "${BUNDLE_DIR}"/dmg/*.dmg "${DIST_DIR}/"

          # Generate standard macOS .pkg installer
          APP_VERSION="$(node -p "require('./package.json').version")"
          productbuild \
            --component "${APP_PATH}" /Applications \
            --identifier "id.my.chiroot.desktop" \
            --version "${APP_VERSION}" \
            "${DIST_DIR}/Chiroot-Desktop_${APP_VERSION}_x64.pkg"

          # Archive .app bundle for direct download
          tar -czf "${DIST_DIR}/Chiroot-Desktop_${APP_VERSION}_x64.app.tar.gz" \
            -C "${BUNDLE_DIR}/macos" "Chiroot Desktop.app"

          ls -lh "${DIST_DIR}"

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chiroot-desktop-macos-x86_64
          path: |
            dist-artifacts/*.dmg
            dist-artifacts/*.pkg
            dist-artifacts/*.app.tar.gz
          if-no-files-found: error

      - name: Attach distributables to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist-artifacts/*.dmg
            dist-artifacts/*.pkg
            dist-artifacts/*.app.tar.gz
